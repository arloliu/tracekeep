name: Bench
# The catalog's benchmarks on MariaDB (650-perf-sec.md, T-54), MariaDB's rows only, one job a group of benchmarks:
# in each, a base measured twice and a head once, on one runner, judged by benchjudge against the base's own repeatability;
# started by hand only.
on:
  workflow_dispatch:
    inputs:
      base:
        description: The base commit (its full SHA), branch or tag
        required: true
      head:
        description: The head commit (its full SHA), branch or tag
        required: true
      benchtime:
        description: go test's -benchtime, longer to measure an inconclusive row again
        default: 1s
      scale:
        description: TRACEKEEP_BENCH_SCALE, the largest size run
        type: choice
        options: [ small, medium, large ]
        default: small

permissions:
  contents: read

env:
  # benchstat at a pinned version, so a comparison's tables are reproducible.
  BENCHSTAT: golang.org/x/perf/cmd/benchstat@v0.0.0-20261009192801-be2c69fb417e
  BENCHTIME: ${{ inputs.benchtime }}
  TRACEKEEP_BENCH_SCALE: ${{ inputs.scale }}

jobs:
  mariadb:
    name: mariadb (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    # Every group runs to its end: one group's failure says nothing of another's rows.
    strategy:
      fail-fast: false
      # The groups of the benchmarks reaching MariaDB, each the packages and -bench expression scripts/catalog.sh bench runs.
      # Together they hold every benchmark of those packages, each in one group (internal/benchscale's TestBenchGroups).
      matrix:
        include:
        # Registration first and alone: its fixed-N passes run only here, and benchjudge requires its MariaDB shapes.
        - group: registration
          packages: ./internal/catalog/
          bench: ^BenchmarkRegisterPack$
        - group: claim-listing
          packages: ./internal/catalog/
          bench: ^BenchmarkRecordListing$
        - group: listings
          packages: ./internal/catalog/
          bench: ^Benchmark(Listings|ListingHistory)$
        - group: lookups
          packages: ./internal/catalog/
          bench: ^Benchmark(Lookups|Resolve)$
        - group: retention
          packages: ./internal/catalog/
          bench: ^Benchmark(AuditWhileRegistering|PruneEvents|DeleteCandidates|EvictHour|EvictMerges)$
        - group: metrics
          packages: ./internal/metrics/
          bench: ^BenchmarkReadCatalog$
    env:
      BENCH_PACKAGES: ${{ matrix.packages }}
      BENCH: ${{ matrix.bench }}
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ inputs.head }}
        path: head
    - uses: actions/checkout@v7
      with:
        ref: ${{ inputs.base }}
        path: base
    # The head's tools measure both trees: the base may predate them.
    - name: Setup Go from the head's mise.toml
      uses: jdx/mise-action@v4
      with:
        working_directory: head
        install_args: go
    # The base's own mise.toml, if it pins another Go, must not pick the toolchain in its tree.
    - name: Use the head's Go in both trees
      run: dirname "$(cd head && mise which go)" >> "$GITHUB_PATH"

    # What a baseline records (650-perf-sec.md, T-54), in the log and the run's summary: never a host, a runner or a vendor's model.
    # Each tree's engine versions and durability settings are printed by its catalog.sh run, which alone sees its MariaDB container.
    - name: Machine facts
      run: |
        echo "CPU=$(nproc)" >> "$GITHUB_ENV"
        {
          echo "## ${{ matrix.group }}"
          echo '```'
          echo "base: $(git -C base rev-parse HEAD)"
          echo "head: $(git -C head rev-parse HEAD)"
          go version
          echo "benchstat: $BENCHSTAT"
          echo "cores: $(nproc)"
          lscpu | grep -E '^(Architecture|CPU\(s\)|Thread\(s\) per core|Core\(s\) per socket|Socket\(s\)|L2 cache|L3 cache|Hypervisor vendor):' || true
          echo "filesystem of the work: $(stat -f -c %T "$GITHUB_WORKSPACE")"
          echo "filesystem of the tests' temporary directory: $(stat -f -c %T "${TMPDIR:-/tmp}")"
          echo "filesystem of MariaDB's data: $(sudo stat -f -c %T "$(docker info -f '{{.DockerRootDir}}')")"
          echo "packages: $BENCH_PACKAGES; -bench $BENCH; MariaDB's rows only (TRACEKEEP_BENCH_ENGINES=mariadb)"
          echo "-cpu $(nproc) -count 10 -benchtime $BENCHTIME, scale $TRACEKEEP_BENCH_SCALE"
          if [ "${{ matrix.group }}" = registration ]; then
            echo "BenchmarkRegisterPack at 100x, its ranges cells at 1x"
          fi
          echo '```'
          echo
          echo '| Benchmarks | A synchronization to disk in the timed work |'
          echo '|---|---|'
          echo '| catalog RegisterPack, AuditWhileRegistering, PruneEvents, EvictHour, EvictMerges; RecordListing attributed/new, unattributed/new, unattributed/gone | yes: catalog commits that write, MariaDB as innodb_flush_log_at_trx_commit says |'
          echo '| catalog RecordListing attributed/steady, attributed/gone, attributed/tiny, unattributed/steady | no: their transactions change no row, the lease check rewriting its row unchanged (SQLite checked: no WAL frame; MariaDB to confirm) |'
          echo '| catalog Listings, ListingHistory, Lookups, Resolve, DeleteCandidates; metrics ReadCatalog | no: reads |'
        } | tee -a "$GITHUB_STEP_SUMMARY"

    # The group's benchmarks in each tree, as go test lists them, so the groups' union can be checked against every MariaDB row.
    - name: Rows
      run: |
        mkdir out
        for tree in base head; do
          (cd "$tree" && GOWORK=off go test $BENCH_PACKAGES -run '^$' -list "$BENCH" | grep '^Benchmark' | sort) > "out/rows-$tree.txt"
        done
        {
          echo '```'
          echo "the group's benchmarks, base | head:"
          paste -d '|' out/rows-base.txt out/rows-head.txt
          echo '```'
        } | tee -a "$GITHUB_STEP_SUMMARY"

    # The head between the base's two runs, so the base's repeatability spans the head's run.
    - name: Benchmarks
      run: |
        (cd base && ../head/scripts/catalog.sh bench ../out/base1.txt)
        (cd head && scripts/catalog.sh bench ../out/head.txt)
        (cd base && ../head/scripts/catalog.sh bench ../out/base2.txt)

    - name: Upload the raw samples
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: bench-${{ matrix.group }}-${{ github.run_id }}
        path: out/

    - name: benchstat
      run: |
        echo "## the base's repeatability, base1 against base2"
        go run "$BENCHSTAT" base1=out/base1.txt base2=out/base2.txt
        echo "## the change, base1 against head"
        go run "$BENCHSTAT" base=out/base1.txt head=out/head.txt

    # Every listed benchmark has a MariaDB row on its side and no side has a SQLite row: the engine filter held.
    - name: MariaDB's rows only
      run: |
        fail=0
        for f in base1 head base2; do
          tree=head; [ "$f" = head ] || tree=base
          if grep -E '^Benchmark[^ ]*/sqlite(/|-[0-9]+[[:space:]])' "out/$f.txt"; then
            echo "$f: SQLite rows ran" >&2; fail=1
          fi
          while read -r name; do
            grep -qE "^$name/([^ ]*/)?mariadb(/|-[0-9]+[[:space:]])" "out/$f.txt" || { echo "$f: $name has no MariaDB row" >&2; fail=1; }
          done < "out/rows-$tree.txt"
        done
        exit $fail

    # Fails on a regression or a failed row, and on an inconclusive one (exit 3), which is measured again, never passed.
    - name: Decisions
      if: matrix.group != 'registration'
      run: cd head && go run ./cmd/benchjudge ../out/base1.txt ../out/base2.txt ../out/head.txt
    # Registration's rows run at a fixed N, the same on every side, and each of its shapes must be measured on MariaDB.
    - name: Decisions of registration
      if: matrix.group == 'registration'
      run: |
        cd head && go run ./cmd/benchjudge -fixed 'BenchmarkRegisterPack/' \
          -require 'BenchmarkRegisterPack/evidence/.*/mariadb' -require 'BenchmarkRegisterPack/parked/.*/mariadb' \
          -require 'BenchmarkRegisterPack/ranges/.*/mariadb' \
          -require 'BenchmarkRegisterPack/miss/.*/mariadb' -require 'BenchmarkRegisterPack/hit/.*/mariadb' \
          ../out/base1.txt ../out/base2.txt ../out/head.txt
