name: CI
on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    # Go and golangci-lint at the versions mise.toml pins; Atlas is not needed until migrations exist.
    - name: Setup Go and golangci-lint from mise.toml
      uses: jdx/mise-action@v4
      with:
        install_args: go golangci-lint
    - name: Display tool versions
      run: |
        go version
        golangci-lint version

    # Lint, vet, docs-check, data-check, -race tests of every module (all but the service with GOWORK=off),
    # then the service built with GOWORK=off; tests use the embedded nats-server, no external service.
    - name: make ci
      run: make ci
    # The SDK's minimum resolved graph, the one make ci tested.
    - name: Resolved module graph of the SDK
      run: cd producer && GOWORK=off go list -m all

  # The SDK and its bus tests on the latest nats.go, the graph a newer producer resolves;
  # the pinned go.mod, which make ci tests, is the minimum one (producer-sdk.md §4.7 *Versions*).
  latest-nats:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Setup Go from mise.toml
      uses: jdx/mise-action@v4
      with:
        install_args: go
    - name: make test-latest
      run: make test-latest

  # The s3 store against the S3-compatible stores deployments run, each in a container (T-34);
  # make ci skips those tests, since they need docker.
  s3-stores:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Setup Go from mise.toml
      uses: jdx/mise-action@v4
      with:
        install_args: go
    - name: make test-s3
      run: make test-s3

  # The vault key provider against a dev-mode Vault server in a container, over TLS;
  # make ci runs its tests against an httptest fake only.
  vault:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Setup Go from mise.toml
      uses: jdx/mise-action@v4
      with:
        install_args: go
    - name: make test-vault
      run: make test-vault

  # The catalog on MariaDB, and its migrations validated and checked against schema.hcl, each with a MariaDB container;
  # make ci runs the catalog's tests on SQLite only.
  catalog:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Setup Go and Atlas from mise.toml
      uses: jdx/mise-action@v4
      with:
        install_args: go atlas
    - name: make migrate-check
      run: make migrate-check
    - name: make test-catalog
      run: make test-catalog

  # The frontend: its lint, type check and tests, then the release binary with the build embedded (api.md §10.3);
  # make ci needs no Node, so this job is the frontend's gate.
  web:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Setup Go and Node from mise.toml
      uses: jdx/mise-action@v4
      with:
        install_args: go node
    - name: npm ci
      run: cd web && npm ci --no-audit --no-fund
    - name: make web-check
      run: make web-check
    - name: make build
      run: make build

  # The packaging's checks a pull request can run (architecture.md §3.3): the image for both platforms, neither loaded nor pushed, the chart, its alert rules and the systemd unit;
  # the browser-driven packaging tests run on main instead (T-50).
  packaging-checks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    # A docker-container builder, since the docker driver builds no second platform.
    - name: Set up Buildx
      uses: docker/setup-buildx-action@v3
    - name: make image-check
      run: make image-check
    - name: Setup helm and kubeconform from mise.toml
      uses: jdx/mise-action@v4
      with:
        install_args: helm kubeconform promtool
    - name: make chart-check
      run: make chart-check
    - name: make alerts-check
      run: make alerts-check
    - name: make unit-check
      run: make unit-check
