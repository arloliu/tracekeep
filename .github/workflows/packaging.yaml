name: Packaging
# The packaging tests (architecture.md §3.3 *Packaging tests*, T-50): the chart on kind and the unit on the runner,
# each driven by a browser, on main, daily and when dispatched; never on a pull request, which runs the packaging checks instead.
on:
  push:
    branches: [ "main" ]
  schedule:
  - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: packaging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
    - uses: actions/checkout@v7
      with:
        # The upgrade's baseline is an ancestor, found in the history.
        fetch-depth: 0
    - name: Setup Go, Node, helm, kind and kubectl from mise.toml
      uses: jdx/mise-action@v4
      with:
        install_args: go node helm kind kubectl
    - name: npm ci
      run: cd web && npm ci --no-audit --no-fund
    - name: Install certutil for the browser's trust store
      run: sudo apt-get update -q && sudo apt-get install -y -q libnss3-tools
    - name: The upgrade's baseline
      env:
        GH_TOKEN: ${{ github.token }}
      run: echo "TRACEKEEP_BASELINE=$(scripts/packaging/baseline.sh)" >> "$GITHUB_ENV"
    - name: make packaging-cluster
      run: make packaging-cluster

  standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Setup Go and Node from mise.toml
      uses: jdx/mise-action@v4
      with:
        install_args: go node
    - name: npm ci
      run: cd web && npm ci --no-audit --no-fund
    - name: Install certutil for the browser's trust store
      run: sudo apt-get update -q && sudo apt-get install -y -q libnss3-tools
    - name: The upgrade's baseline
      env:
        GH_TOKEN: ${{ github.token }}
      run: echo "TRACEKEEP_BASELINE=$(scripts/packaging/baseline.sh)" >> "$GITHUB_ENV"
    - name: make packaging-standalone
      run: make packaging-standalone
