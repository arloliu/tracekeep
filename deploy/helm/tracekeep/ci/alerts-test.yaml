# The alert rules' tests (make alerts-check): promtool test rules against the chart's rendered rules, alerts.yaml.
# Two ingest or compact replicas observe the same shared state; a stale source fires nothing; a counter fires on its increase.
rule_files: [alerts.yaml]
evaluation_interval: 1m
tests:
- name: deferred, the maximum of two replicas
  interval: 1m
  input_series:
  - {series: 'tracekeep_ingest_deferred_oldest_age_seconds{instance="a",reason="cannot-screen"}', values: '4000x10'}
  - {series: 'tracekeep_ingest_deferred_oldest_age_seconds{instance="b",reason="cannot-screen"}', values: '4000x10'}
  alert_rule_test:
  - {eval_time: 3m, alertname: TracekeepDeferredOld, exp_alerts: []}
  - eval_time: 6m
    alertname: TracekeepDeferredOld
    exp_alerts: [{exp_labels: {severity: warning, reason: cannot-screen}, exp_annotations: {summary: "A message has been deferred for more than an hour (cannot-screen).", runbook_url: "rb#parked"}}]
- name: deferred younger than an hour on each of two replicas
  interval: 1m
  input_series:
  - {series: 'tracekeep_ingest_deferred_oldest_age_seconds{instance="a",reason="unknown-capture"}', values: '2000x10'}
  - {series: 'tracekeep_ingest_deferred_oldest_age_seconds{instance="b",reason="unknown-capture"}', values: '2000x10'}
  alert_rule_test:
  - {eval_time: 8m, alertname: TracekeepDeferredOld, exp_alerts: []}

- name: backlog, two replicas each under the threshold do not add up
  interval: 1m
  input_series:
  - {series: 'tracekeep_ingest_stream_backlog_bytes{instance="a"}', values: '6000000000x30'}
  - {series: 'tracekeep_ingest_stream_backlog_bytes{instance="b"}', values: '6000000000x30'}
  - {series: 'tracekeep_ingest_refreshed_timestamp_seconds{instance="a",source="bus"}', values: '0+60x30'}
  alert_rule_test:
  - {eval_time: 20m, alertname: TracekeepBacklogHigh, exp_alerts: []}
- name: backlog over the threshold, fresh
  interval: 1m
  input_series:
  - {series: 'tracekeep_ingest_stream_backlog_bytes{instance="a"}', values: '11000000000x30'}
  - {series: 'tracekeep_ingest_refreshed_timestamp_seconds{instance="a",source="bus"}', values: '0+60x30'}
  alert_rule_test:
  - {eval_time: 10m, alertname: TracekeepBacklogHigh, exp_alerts: []}
  - eval_time: 16m
    alertname: TracekeepBacklogHigh
    exp_alerts: [{exp_labels: {severity: warning}, exp_annotations: {summary: "The traffic stream holds more than 10737418240 bytes.", runbook_url: "rb#backlog"}}]
- name: backlog over the threshold, its source stale
  interval: 1m
  input_series:
  - {series: 'tracekeep_ingest_stream_backlog_bytes{instance="a"}', values: '11000000000x30'}
  - {series: 'tracekeep_ingest_refreshed_timestamp_seconds{instance="a",source="bus"}', values: '0x30'}
  alert_rule_test:
  - {eval_time: 28m, alertname: TracekeepBacklogHigh, exp_alerts: []}

- name: backlog, one replica's stale snapshot high, another's fresh and low
  interval: 1m
  input_series:
  - {series: 'tracekeep_ingest_stream_backlog_bytes{instance="a"}', values: '11000000000x30'}
  - {series: 'tracekeep_ingest_refreshed_timestamp_seconds{instance="a",source="bus"}', values: '0x30'}
  - {series: 'tracekeep_ingest_stream_backlog_bytes{instance="b"}', values: '1000000000x30'}
  - {series: 'tracekeep_ingest_refreshed_timestamp_seconds{instance="b",source="bus"}', values: '0+60x30'}
  alert_rule_test:
  - {eval_time: 28m, alertname: TracekeepBacklogHigh, exp_alerts: []}

- name: no replica holds the lease
  interval: 1m
  input_series:
  - {series: 'tracekeep_compact_lease_held{instance="a"}', values: '0x10'}
  - {series: 'tracekeep_compact_lease_held{instance="b"}', values: '0x10'}
  alert_rule_test:
  - eval_time: 6m
    alertname: TracekeepCompactLeaseLost
    exp_alerts: [{exp_labels: {severity: critical}, exp_annotations: {summary: "No compact replica holds the lease.", runbook_url: "rb#lease-lost"}}]
- name: no compact replica at all
  interval: 1m
  input_series:
  - {series: 'up{job="other"}', values: '1x10'}
  alert_rule_test:
  - eval_time: 6m
    alertname: TracekeepCompactLeaseLost
    exp_alerts: [{exp_labels: {severity: critical}, exp_annotations: {summary: "No compact replica holds the lease.", runbook_url: "rb#lease-lost"}}]
- name: one replica holds the lease, its standby not
  interval: 1m
  input_series:
  - {series: 'tracekeep_compact_lease_held{instance="a"}', values: '1x10'}
  - {series: 'tracekeep_compact_lease_held{instance="b"}', values: '0x10'}
  alert_rule_test:
  - {eval_time: 8m, alertname: TracekeepCompactLeaseLost, exp_alerts: []}

- name: merges completing every five minutes
  interval: 5m
  input_series:
  - {series: 'tracekeep_compact_lease_held{instance="a"}', values: '1x60'}
  - {series: 'tracekeep_compact_last_success_timestamp{instance="a",task="merge"}', values: '0+300x60'}
  alert_rule_test:
  - {eval_time: 4h30m, alertname: TracekeepMergeStalled, exp_alerts: []}
- name: the last merge cycle completed two hours ago
  interval: 5m
  input_series:
  - {series: 'tracekeep_compact_lease_held{instance="a"}', values: '1x60'}
  - {series: 'tracekeep_compact_last_success_timestamp{instance="a",task="merge"}', values: '0x60'}
  alert_rule_test:
  - {eval_time: 1h55m, alertname: TracekeepMergeStalled, exp_alerts: []}
  - eval_time: 2h10m
    alertname: TracekeepMergeStalled
    exp_alerts: [{exp_labels: {severity: warning, cause: last-cycle-old}, exp_annotations: {summary: "The merge task has completed no cycle for two hours.", runbook_url: "rb#merge-stalled"}}]
- name: a standby's recent timestamp does not hide the holder's stalled task
  interval: 5m
  input_series:
  - {series: 'tracekeep_compact_lease_held{instance="a"}', values: '0x60'}
  - {series: 'tracekeep_compact_last_success_timestamp{instance="a",task="merge"}', values: '0+300x60'}
  - {series: 'tracekeep_compact_lease_held{instance="b"}', values: '1x60'}
  - {series: 'tracekeep_compact_last_success_timestamp{instance="b",task="merge"}', values: '0x60'}
  alert_rule_test:
  - eval_time: 2h10m
    alertname: TracekeepMergeStalled
    exp_alerts: [{exp_labels: {severity: warning, cause: last-cycle-old}, exp_annotations: {summary: "The merge task has completed no cycle for two hours.", runbook_url: "rb#merge-stalled"}}]
- name: a lease taken over, the new holder never completing a cycle
  interval: 5m
  input_series:
  - {series: 'tracekeep_compact_lease_held{instance="a"}', values: '1x12 0x48'}
  - {series: 'tracekeep_compact_last_success_timestamp{instance="a",task="merge"}', values: '0+300x12 3600x48'}
  - {series: 'tracekeep_compact_lease_held{instance="b"}', values: '0x12 1x48'}
  alert_rule_test:
  - {eval_time: 2h30m, alertname: TracekeepMergeStalled, exp_alerts: []}
  - eval_time: 3h10m
    alertname: TracekeepMergeStalled
    exp_alerts: [{exp_labels: {severity: warning, cause: no-cycle-since-lease}, exp_annotations: {summary: "The merge task has completed no cycle for two hours.", runbook_url: "rb#merge-stalled"}}]
- name: a refused merge
  interval: 1m
  input_series:
  - {series: 'tracekeep_compact_merges_total{instance="a",outcome="refused"}', values: '0 0 0 1 1 1'}
  alert_rule_test:
  - {eval_time: 2m, alertname: TracekeepMergeRefused, exp_alerts: []}
  - eval_time: 5m
    alertname: TracekeepMergeRefused
    exp_alerts: [{exp_labels: {severity: warning}, exp_annotations: {summary: "A merge was refused over the reader's metadata budget.", runbook_url: "rb#merge-over-budget"}}]

- name: open gaps growing on a tool, fresh, two replicas
  interval: 1m
  input_series:
  - {series: 'tracekeep_ingest_open_gaps{instance="a",tool_id="T-1"}', values: '1x30 3x10'}
  - {series: 'tracekeep_ingest_open_gaps{instance="b",tool_id="T-1"}', values: '1x30 3x10'}
  - {series: 'tracekeep_ingest_refreshed_timestamp_seconds{instance="a",source="catalog"}', values: '0+60x40'}
  alert_rule_test:
  - {eval_time: 20m, alertname: TracekeepGapsGrowing, exp_alerts: []}
  - eval_time: 35m
    alertname: TracekeepGapsGrowing
    exp_alerts: [{exp_labels: {severity: warning, tool_id: T-1}, exp_annotations: {summary: "Tool T-1: open gaps or declared losses increasing.", runbook_url: "rb#gaps-and-losses"}}]
- name: open gaps grown but their source stale
  interval: 1m
  input_series:
  - {series: 'tracekeep_ingest_open_gaps{instance="a",tool_id="T-1"}', values: '1x30 3x10'}
  - {series: 'tracekeep_ingest_refreshed_timestamp_seconds{instance="a",source="catalog"}', values: '0x40'}
  alert_rule_test:
  - {eval_time: 35m, alertname: TracekeepGapsGrowing, exp_alerts: []}
- name: open gaps grown in one replica's stale snapshot, flat in another's fresh one
  interval: 1m
  input_series:
  - {series: 'tracekeep_ingest_open_gaps{instance="a",tool_id="T-1"}', values: '1x30 3x10'}
  - {series: 'tracekeep_ingest_refreshed_timestamp_seconds{instance="a",source="catalog"}', values: '0x40'}
  - {series: 'tracekeep_ingest_open_gaps{instance="b",tool_id="T-1"}', values: '1x40'}
  - {series: 'tracekeep_ingest_refreshed_timestamp_seconds{instance="b",source="catalog"}', values: '0+60x40'}
  alert_rule_test:
  - {eval_time: 35m, alertname: TracekeepGapsGrowing, exp_alerts: []}
- name: declared losses on a tool, counted across a restart's reset
  interval: 1m
  input_series:
  - {series: 'tracekeep_ingest_declared_losses_total{instance="a",tool_id="T-2"}', values: '5x40 0 2'}
  alert_rule_test:
  - {eval_time: 35m, alertname: TracekeepGapsGrowing, exp_alerts: []}
  - eval_time: 42m
    alertname: TracekeepGapsGrowing
    exp_alerts: [{exp_labels: {severity: warning, tool_id: T-2}, exp_annotations: {summary: "Tool T-2: open gaps or declared losses increasing.", runbook_url: "rb#gaps-and-losses"}}]

- name: a key refused
  interval: 1m
  input_series:
  - {series: 'tracekeep_key_resolutions_total{instance="a",kind="session",outcome="refused"}', values: '0 0 1 1'}
  - {series: 'tracekeep_key_resolutions_total{instance="a",kind="session",outcome="resolved"}', values: '0 5 9 12'}
  alert_rule_test:
  - eval_time: 3m
    alertname: TracekeepKeyRefused
    exp_alerts: [{exp_labels: {severity: critical}, exp_annotations: {summary: "A key resolution was refused.", runbook_url: "rb#key-refused"}}]
- name: keys unavailable for five minutes
  interval: 1m
  input_series:
  - {series: 'tracekeep_key_resolutions_total{instance="a",kind="digest",outcome="unavailable"}', values: '0+1x15'}
  alert_rule_test:
  - {eval_time: 3m, alertname: TracekeepKeysUnavailable, exp_alerts: []}
  - eval_time: 8m
    alertname: TracekeepKeysUnavailable
    exp_alerts: [{exp_labels: {severity: critical}, exp_annotations: {summary: "Key resolutions have been unavailable for five minutes.", runbook_url: "rb#keys-unavailable"}}]

- name: a connected producer publishing
  interval: 1m
  input_series:
  - {series: 'tracepub_bus_connected{job="gw",instance="gw-1"}', values: '1x30'}
  - {series: 'tracepub_records_published_total{job="gw",instance="gw-1"}', values: '0+10x30'}
  alert_rule_test:
  - {eval_time: 25m, alertname: TracepubToolSilent, exp_alerts: []}
- name: a connected producer silent, and one that never published
  interval: 1m
  input_series:
  - {series: 'tracepub_bus_connected{job="gw",instance="gw-1"}', values: '1x30'}
  - {series: 'tracepub_records_published_total{job="gw",instance="gw-1"}', values: '7x30'}
  - {series: 'tracepub_bus_connected{job="gw",instance="gw-2"}', values: '1x30'}
  alert_rule_test:
  - eval_time: 22m
    alertname: TracepubToolSilent
    exp_alerts:
    - {exp_labels: {severity: warning, job: gw, instance: gw-1}, exp_annotations: {summary: "Producer gw-1 is connected and has published nothing for ten minutes.", runbook_url: "rb#tool-silent"}}
    - {exp_labels: {severity: warning, job: gw, instance: gw-2}, exp_annotations: {summary: "Producer gw-2 is connected and has published nothing for ten minutes.", runbook_url: "rb#tool-silent"}}
- name: a producer connected only minutes ago, not yet published
  interval: 1m
  input_series:
  - {series: 'tracepub_bus_connected{job="gw",instance="gw-3"}', values: '0x10 1x8'}
  alert_rule_test:
  - {eval_time: 17m, alertname: TracepubToolSilent, exp_alerts: []}
- name: a connected producer that stops publishing
  interval: 1m
  input_series:
  - {series: 'tracepub_bus_connected{job="gw",instance="gw-1"}', values: '1x45'}
  - {series: 'tracepub_records_published_total{job="gw",instance="gw-1"}', values: '0+10x20 200x25'}
  alert_rule_test:
  - {eval_time: 28m, alertname: TracepubToolSilent, exp_alerts: []}
  - eval_time: 33m
    alertname: TracepubToolSilent
    exp_alerts: [{exp_labels: {severity: warning, job: gw, instance: gw-1}, exp_annotations: {summary: "Producer gw-1 is connected and has published nothing for ten minutes.", runbook_url: "rb#tool-silent"}}]
- name: a producer dropping records
  interval: 1m
  input_series:
  - {series: 'tracepub_records_dropped_total{job="gw",instance="gw-1",reason="lane_full"}', values: '0 0 4 4'}
  alert_rule_test:
  - eval_time: 3m
    alertname: TracepubDropping
    exp_alerts: [{exp_labels: {severity: warning, job: gw, instance: gw-1}, exp_annotations: {summary: "Producer gw-1 is dropping records.", runbook_url: "rb#producer-drops"}}]

- name: the first refused merge, its counter exposed from zero
  interval: 1m
  input_series:
  - {series: 'tracekeep_compact_merges_total{instance="a",outcome="refused"}', values: '0x5 1x20'}
  alert_rule_test:
  - {eval_time: 3m, alertname: TracekeepMergeRefused, exp_alerts: []}
  - eval_time: 10m
    alertname: TracekeepMergeRefused
    exp_alerts: [{exp_labels: {severity: warning}, exp_annotations: {summary: "A merge was refused over the reader's metadata budget.", runbook_url: "rb#merge-over-budget"}}]
- name: a tool's first declared loss, its counter exposed from zero since the tool wrote
  interval: 1m
  input_series:
  - {series: 'tracekeep_ingest_declared_losses_total{instance="a",tool_id="T-3"}', values: '0x5 2x40'}
  alert_rule_test:
  - eval_time: 10m
    alertname: TracekeepGapsGrowing
    exp_alerts: [{exp_labels: {severity: warning, tool_id: T-3}, exp_annotations: {summary: "Tool T-3: open gaps or declared losses increasing.", runbook_url: "rb#gaps-and-losses"}}]
  - {eval_time: 40m, alertname: TracekeepGapsGrowing, exp_alerts: []}
- name: a key's first refusal, its counter exposed from zero
  interval: 1m
  input_series:
  - {series: 'tracekeep_key_resolutions_total{instance="a",kind="digest",outcome="refused"}', values: '0x5 1x20'}
  alert_rule_test:
  - eval_time: 8m
    alertname: TracekeepKeyRefused
    exp_alerts: [{exp_labels: {severity: critical}, exp_annotations: {summary: "A key resolution was refused.", runbook_url: "rb#key-refused"}}]
  - {eval_time: 20m, alertname: TracekeepKeyRefused, exp_alerts: []}
- name: a producer's drops, the first of a reason seen only from the second
  interval: 1m
  input_series:
  - {series: 'tracepub_records_dropped_total{job="gw",instance="gw-1",reason="bus_down"}', values: '_x5 3 3 5x20'}
  alert_rule_test:
  - eval_time: 8m
    alertname: TracepubDropping
    exp_alerts: [{exp_labels: {severity: warning, job: gw, instance: gw-1}, exp_annotations: {summary: "Producer gw-1 is dropping records.", runbook_url: "rb#producer-drops"}}]
- name: a producer that appears connected, never having published
  interval: 1m
  input_series:
  - {series: 'tracepub_bus_connected{job="gw",instance="gw-4"}', values: '1x30'}
  alert_rule_test:
  - {eval_time: 5m, alertname: TracepubToolSilent, exp_alerts: []}
  - eval_time: 12m
    alertname: TracepubToolSilent
    exp_alerts: [{exp_labels: {severity: warning, job: gw, instance: gw-4}, exp_annotations: {summary: "Producer gw-4 is connected and has published nothing for ten minutes.", runbook_url: "rb#tool-silent"}}]
- name: a producer's first publication
  interval: 1m
  input_series:
  - {series: 'tracepub_bus_connected{job="gw",instance="gw-5"}', values: '1x30'}
  - {series: 'tracepub_records_published_total{job="gw",instance="gw-5"}', values: '_x8 4x22'}
  alert_rule_test:
  - {eval_time: 12m, alertname: TracepubToolSilent, exp_alerts: []}
- name: a cold Prometheus scraping an old refusal counter fires nothing
  interval: 1m
  input_series:
  - {series: 'tracekeep_key_resolutions_total{instance="a",kind="digest",outcome="refused"}', values: '1x30'}
  alert_rule_test:
  - {eval_time: 3m, alertname: TracekeepKeyRefused, exp_alerts: []}
  - {eval_time: 20m, alertname: TracekeepKeyRefused, exp_alerts: []}
- name: a process restarted under the same labels, its first refusal counted from its zero
  interval: 1m
  input_series:
  - {series: 'tracekeep_key_resolutions_total{instance="a",kind="digest",outcome="refused"}', values: '1x10 0 1x10'}
  alert_rule_test:
  - eval_time: 13m
    alertname: TracekeepKeyRefused
    exp_alerts: [{exp_labels: {severity: critical}, exp_annotations: {summary: "A key resolution was refused.", runbook_url: "rb#key-refused"}}]
