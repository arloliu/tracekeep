# The alert rules' tests (make alerts-check): promtool test rules against the chart's rendered rules, alerts.yaml.
# Two ingest or compact replicas observe the same shared state; a stale source fires nothing; a counter fires on its increase.
rule_files: [alerts.yaml]
evaluation_interval: 1m
tests:
- name: deferred, the maximum of two replicas
  interval: 1m
  input_series:
  - {series: 'tracekeep_ingest_deferred_oldest_age_seconds{pod="a",reason="cannot-screen"}', values: '4000x10'}
  - {series: 'tracekeep_ingest_deferred_oldest_age_seconds{pod="b",reason="cannot-screen"}', values: '4000x10'}
  alert_rule_test:
  - {eval_time: 3m, alertname: TracekeepDeferredOld, exp_alerts: []}
  - eval_time: 6m
    alertname: TracekeepDeferredOld
    exp_alerts: [{exp_labels: {severity: warning}, exp_annotations: {summary: "A message has been deferred for more than an hour.", runbook_url: "rb#parked"}}]
- name: deferred younger than an hour on each of two replicas
  interval: 1m
  input_series:
  - {series: 'tracekeep_ingest_deferred_oldest_age_seconds{pod="a",reason="unknown-capture"}', values: '2000x10'}
  - {series: 'tracekeep_ingest_deferred_oldest_age_seconds{pod="b",reason="unknown-capture"}', values: '2000x10'}
  alert_rule_test:
  - {eval_time: 8m, alertname: TracekeepDeferredOld, exp_alerts: []}

- name: backlog, two replicas each under the threshold do not add up
  interval: 1m
  input_series:
  - {series: 'tracekeep_ingest_stream_backlog_bytes{pod="a"}', values: '6000000000x30'}
  - {series: 'tracekeep_ingest_stream_backlog_bytes{pod="b"}', values: '6000000000x30'}
  - {series: 'tracekeep_ingest_refreshed_timestamp_seconds{pod="a",source="bus"}', values: '0+60x30'}
  alert_rule_test:
  - {eval_time: 20m, alertname: TracekeepBacklogHigh, exp_alerts: []}
- name: backlog over the threshold, fresh
  interval: 1m
  input_series:
  - {series: 'tracekeep_ingest_stream_backlog_bytes{pod="a"}', values: '11000000000x30'}
  - {series: 'tracekeep_ingest_refreshed_timestamp_seconds{pod="a",source="bus"}', values: '0+60x30'}
  alert_rule_test:
  - {eval_time: 10m, alertname: TracekeepBacklogHigh, exp_alerts: []}
  - eval_time: 16m
    alertname: TracekeepBacklogHigh
    exp_alerts: [{exp_labels: {severity: warning}, exp_annotations: {summary: "The traffic stream holds more than 10737418240 bytes.", runbook_url: "rb#backlog"}}]
- name: backlog over the threshold, its source stale
  interval: 1m
  input_series:
  - {series: 'tracekeep_ingest_stream_backlog_bytes{pod="a"}', values: '11000000000x30'}
  - {series: 'tracekeep_ingest_refreshed_timestamp_seconds{pod="a",source="bus"}', values: '0x30'}
  alert_rule_test:
  - {eval_time: 28m, alertname: TracekeepBacklogHigh, exp_alerts: []}

- name: no replica holds the lease
  interval: 1m
  input_series:
  - {series: 'tracekeep_compact_lease_held{pod="a"}', values: '0x10'}
  - {series: 'tracekeep_compact_lease_held{pod="b"}', values: '0x10'}
  alert_rule_test:
  - eval_time: 6m
    alertname: TracekeepCompactLeaseLost
    exp_alerts: [{exp_labels: {severity: critical}, exp_annotations: {summary: "No compact replica holds the lease.", runbook_url: "rb#lease-lost"}}]
- name: no compact replica at all
  interval: 1m
  input_series:
  - {series: 'up{job="other"}', values: '1x10'}
  alert_rule_test:
  - eval_time: 6m
    alertname: TracekeepCompactLeaseLost
    exp_alerts: [{exp_labels: {severity: critical}, exp_annotations: {summary: "No compact replica holds the lease.", runbook_url: "rb#lease-lost"}}]
- name: one replica holds the lease, its standby not
  interval: 1m
  input_series:
  - {series: 'tracekeep_compact_lease_held{pod="a"}', values: '1x10'}
  - {series: 'tracekeep_compact_lease_held{pod="b"}', values: '0x10'}
  alert_rule_test:
  - {eval_time: 8m, alertname: TracekeepCompactLeaseLost, exp_alerts: []}

- name: merges completing every five minutes
  interval: 5m
  input_series:
  - {series: 'tracekeep_compact_lease_held{pod="a"}', values: '1x60'}
  - {series: 'tracekeep_compact_last_success_timestamp{pod="a",task="merge"}', values: '0+300x60'}
  alert_rule_test:
  - {eval_time: 4h30m, alertname: TracekeepMergeStalled, exp_alerts: []}
- name: the last merge cycle completed long ago
  interval: 5m
  input_series:
  - {series: 'tracekeep_compact_lease_held{pod="a"}', values: '1x60'}
  - {series: 'tracekeep_compact_last_success_timestamp{pod="a",task="merge"}', values: '0x60'}
  alert_rule_test:
  - {eval_time: 3h, alertname: TracekeepMergeStalled, exp_alerts: []}
  - eval_time: 4h5m
    alertname: TracekeepMergeStalled
    exp_alerts: [{exp_labels: {severity: warning}, exp_annotations: {summary: "The merge task has completed no cycle for two hours.", runbook_url: "rb#merge-stalled"}}]
- name: a lease holder that never completed a merge cycle
  interval: 5m
  input_series:
  - {series: 'tracekeep_compact_lease_held{pod="a"}', values: '1x60'}
  alert_rule_test:
  - {eval_time: 1h, alertname: TracekeepMergeStalled, exp_alerts: []}
  - eval_time: 2h5m
    alertname: TracekeepMergeStalled
    exp_alerts: [{exp_labels: {severity: warning}, exp_annotations: {summary: "The merge task has completed no cycle for two hours.", runbook_url: "rb#merge-stalled"}}]

- name: a refused merge
  interval: 1m
  input_series:
  - {series: 'tracekeep_compact_merges_total{pod="a",outcome="refused"}', values: '0 0 0 1 1 1'}
  alert_rule_test:
  - {eval_time: 2m, alertname: TracekeepMergeRefused, exp_alerts: []}
  - eval_time: 5m
    alertname: TracekeepMergeRefused
    exp_alerts: [{exp_labels: {severity: warning}, exp_annotations: {summary: "A merge was refused over the reader's metadata budget.", runbook_url: "rb#merge-over-budget"}}]

- name: open gaps growing on a tool, fresh, two replicas
  interval: 1m
  input_series:
  - {series: 'tracekeep_ingest_open_gaps{pod="a",tool_id="T-1"}', values: '1x30 3x10'}
  - {series: 'tracekeep_ingest_open_gaps{pod="b",tool_id="T-1"}', values: '1x30 3x10'}
  - {series: 'tracekeep_ingest_refreshed_timestamp_seconds{pod="a",source="catalog"}', values: '0+60x40'}
  alert_rule_test:
  - {eval_time: 20m, alertname: TracekeepGapsGrowing, exp_alerts: []}
  - eval_time: 35m
    alertname: TracekeepGapsGrowing
    exp_alerts: [{exp_labels: {severity: warning, tool_id: T-1}, exp_annotations: {summary: "Tool T-1: open gaps or declared losses increasing.", runbook_url: "rb#gaps-and-losses"}}]
- name: open gaps grown but their source stale
  interval: 1m
  input_series:
  - {series: 'tracekeep_ingest_open_gaps{pod="a",tool_id="T-1"}', values: '1x30 3x10'}
  - {series: 'tracekeep_ingest_refreshed_timestamp_seconds{pod="a",source="catalog"}', values: '0x40'}
  alert_rule_test:
  - {eval_time: 35m, alertname: TracekeepGapsGrowing, exp_alerts: []}
- name: declared losses on a tool, counted across a restart's reset
  interval: 1m
  input_series:
  - {series: 'tracekeep_ingest_declared_losses_total{pod="a",tool_id="T-2"}', values: '5x10 0 2'}
  alert_rule_test:
  - {eval_time: 5m, alertname: TracekeepGapsGrowing, exp_alerts: []}
  - eval_time: 12m
    alertname: TracekeepGapsGrowing
    exp_alerts: [{exp_labels: {severity: warning, tool_id: T-2}, exp_annotations: {summary: "Tool T-2: open gaps or declared losses increasing.", runbook_url: "rb#gaps-and-losses"}}]

- name: a key refused
  interval: 1m
  input_series:
  - {series: 'tracekeep_key_resolutions_total{pod="a",kind="session",outcome="refused"}', values: '0 0 1 1'}
  - {series: 'tracekeep_key_resolutions_total{pod="a",kind="session",outcome="resolved"}', values: '0 5 9 12'}
  alert_rule_test:
  - eval_time: 3m
    alertname: TracekeepKeyRefused
    exp_alerts: [{exp_labels: {severity: critical}, exp_annotations: {summary: "A key resolution was refused.", runbook_url: "rb#key-refused"}}]
- name: keys unavailable for five minutes
  interval: 1m
  input_series:
  - {series: 'tracekeep_key_resolutions_total{pod="a",kind="digest",outcome="unavailable"}', values: '0+1x15'}
  alert_rule_test:
  - {eval_time: 3m, alertname: TracekeepKeysUnavailable, exp_alerts: []}
  - eval_time: 8m
    alertname: TracekeepKeysUnavailable
    exp_alerts: [{exp_labels: {severity: critical}, exp_annotations: {summary: "Key resolutions have been unavailable for five minutes.", runbook_url: "rb#keys-unavailable"}}]

- name: a connected producer publishing
  interval: 1m
  input_series:
  - {series: 'tracepub_bus_connected{job="gw",instance="gw-1"}', values: '1x30'}
  - {series: 'tracepub_records_published_total{job="gw",instance="gw-1"}', values: '0+10x30'}
  alert_rule_test:
  - {eval_time: 25m, alertname: TracepubToolSilent, exp_alerts: []}
- name: a connected producer silent, and one that never published
  interval: 1m
  input_series:
  - {series: 'tracepub_bus_connected{job="gw",instance="gw-1"}', values: '1x30'}
  - {series: 'tracepub_records_published_total{job="gw",instance="gw-1"}', values: '7x30'}
  - {series: 'tracepub_bus_connected{job="gw",instance="gw-2"}', values: '1x30'}
  alert_rule_test:
  - eval_time: 22m
    alertname: TracepubToolSilent
    exp_alerts:
    - {exp_labels: {severity: warning, job: gw, instance: gw-1}, exp_annotations: {summary: "Producer gw-1 is connected and has published nothing for ten minutes.", runbook_url: "rb#tool-silent"}}
    - {exp_labels: {severity: warning, job: gw, instance: gw-2}, exp_annotations: {summary: "Producer gw-2 is connected and has published nothing for ten minutes.", runbook_url: "rb#tool-silent"}}
- name: a producer dropping records
  interval: 1m
  input_series:
  - {series: 'tracepub_records_dropped_total{job="gw",instance="gw-1",reason="lane_full"}', values: '0 0 4 4'}
  alert_rule_test:
  - eval_time: 3m
    alertname: TracepubDropping
    exp_alerts: [{exp_labels: {severity: warning, job: gw, instance: gw-1}, exp_annotations: {summary: "Producer gw-1 is dropping records.", runbook_url: "rb#producer-drops"}}]
