{{- /*
The alert rules of operations.md §10.4, each linked to its runbook section.
Ingest's gauges of shared state are observed by every ingest replica alike: a rule reads their maximum, never their sum,
over the replicas (instance) whose own snapshot of that source was refreshed within ten minutes;
an event (a key refused or unavailable, a merge refused, a declared loss) is read by the time tracekeep stamped on its last occurrence,
which no scrape can miss as it can a counter's first increment or an unsampled reset; a gateway's counter is read by its increase.
*/ -}}
{{- if .Values.alerts.enabled }}
{{- $runbook := .Values.alerts.runbookURL }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "tracekeep.fullname" . }}
  labels:
    {{- include "tracekeep.labels" . | nindent 4 }}
    {{- with .Values.alerts.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
  - name: tracekeep
    rules:
    - alert: TracekeepDeferredOld
      expr: max by (reason) (tracekeep_ingest_deferred_oldest_age_seconds) > 3600
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "A message has been deferred for more than an hour ({{ "{{" }} $labels.reason {{ "}}" }})."
        runbook_url: {{ $runbook }}#parked
    # A newer producer's bus layout: deferred, never a seq gap, until a release that reads it is deployed.
    - alert: TracekeepLayoutUnsupported
      expr: max(tracekeep_ingest_deferred_messages{reason="unsupported-layout"}) > 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: Ingest defers messages of a bus layout this release does not read.
        runbook_url: {{ $runbook }}#unsupported-layout
    - alert: TracekeepBacklogHigh
      expr: |
        max(
          tracekeep_ingest_stream_backlog_bytes
          and on(instance) (time() - tracekeep_ingest_refreshed_timestamp_seconds{source="bus"}) < 600
        ) > {{ .Values.alerts.backlogBytes | int64 }}
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: The traffic stream holds more than {{ .Values.alerts.backlogBytes | int64 }} bytes.
        runbook_url: {{ $runbook }}#backlog
    - alert: TracekeepCompactLeaseLost
      expr: (max(tracekeep_compact_lease_held) or on() vector(0)) < 1
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: No compact replica holds the lease.
        runbook_url: {{ $runbook }}#lease-lost
    # The lease holder's merge task, never a standby's retained timestamp: a cycle that merged nothing counts as completed.
    - alert: TracekeepMergeStalled
      expr: |
        time() - max(
          tracekeep_compact_last_success_timestamp{task="merge"}
          and on(instance) tracekeep_compact_lease_held == 1
        ) > 7200
      for: 5m
      labels:
        severity: warning
        cause: last-cycle-old
      annotations:
        summary: The merge task has completed no cycle for two hours.
        runbook_url: {{ $runbook }}#merge-stalled
    # A holder that has completed no merge cycle since it took the lease, two hours ago.
    - alert: TracekeepMergeStalled
      expr: |
        max(tracekeep_compact_lease_held == 1)
        unless on() (tracekeep_compact_last_success_timestamp{task="merge"} and on(instance) tracekeep_compact_lease_held == 1)
      for: 2h
      labels:
        severity: warning
        cause: no-cycle-since-lease
      annotations:
        summary: The merge task has completed no cycle for two hours.
        runbook_url: {{ $runbook }}#merge-stalled
    - alert: TracekeepMergeRefused
      expr: min(time() - tracekeep_compact_last_merge_timestamp_seconds{outcome="refused"}) < 3600
      labels:
        severity: warning
      annotations:
        summary: A merge was refused over the reader's metadata budget.
        runbook_url: {{ $runbook }}#merge-over-budget
    - alert: TracekeepGapsGrowing
      expr: |
        (
            max by (equipment_id) (
              tracekeep_ingest_open_gaps
              and on(instance) (time() - tracekeep_ingest_refreshed_timestamp_seconds{source="catalog"}) < 600
            )
          - max by (equipment_id) (
              tracekeep_ingest_open_gaps offset 30m
              and on(instance) (time() - 1800 - tracekeep_ingest_refreshed_timestamp_seconds{source="catalog"} offset 30m) < 600
            )
        ) > 0
        or min by (equipment_id) (time() - tracekeep_ingest_last_declared_loss_timestamp_seconds) < 1800
      labels:
        severity: warning
      annotations:
        summary: "Equipment {{ "{{" }} $labels.equipment_id {{ "}}" }}: open gaps or declared losses increasing."
        runbook_url: {{ $runbook }}#gaps-and-losses
    - alert: TracekeepKeyRefused
      expr: min(time() - tracekeep_key_last_problem_timestamp_seconds{outcome="refused"}) < 600
      labels:
        severity: critical
      annotations:
        summary: A key resolution was refused.
        runbook_url: {{ $runbook }}#key-refused
    - alert: TracekeepKeysUnavailable
      # Unavailable through five minutes: each of their two-minute stretches holds an unavailable use.
      expr: min(time() - tracekeep_key_last_problem_timestamp_seconds{outcome="unavailable"}) < 120
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: Key resolutions have been unavailable for five minutes.
        runbook_url: {{ $runbook }}#keys-unavailable
    # The host log feed (logfeed.md §15.11). An entry's arrival is stamped by the replica holding its group's lease, which moves,
    # and a replica that stopped serves no stamp: the latest stamp over the past day, over every replica, is the equipment's.
    # The feed's backlog holds up to a flush's entries, so its floor over two flush intervals, not its value, grows when the converters fall behind,
    # and it is read only while a replica's snapshot of the feed is fresh.
    - alert: TracekeepLogFeedSilent
      expr: |
        (
          time() - max by (equipment_id) (max_over_time(tracekeep_logfeed_last_entry_timestamp_seconds[1d])) > 900
          and time() - max by (equipment_id) (max_over_time(tracekeep_logfeed_last_entry_timestamp_seconds[1d])) < 86400
        )
        or (
            min_over_time(max(
              tracekeep_logfeed_stream_backlog_messages
              and on(instance) (time() - tracekeep_ingest_refreshed_timestamp_seconds{source="feed"}) < 600
            )[10m:1m])
          > min_over_time(max(
              tracekeep_logfeed_stream_backlog_messages
              and on(instance) (time() - tracekeep_ingest_refreshed_timestamp_seconds{source="feed"}) < 600
            )[10m:1m] offset 15m)
          and on() (time() - max(tracekeep_ingest_refreshed_timestamp_seconds{source="feed"})) < 600
        )
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "The host log feed is silent or falling behind{{ "{{" }} with $labels.equipment_id {{ "}}" }} (equipment {{ "{{" }} . {{ "}}" }}){{ "{{" }} end {{ "}}" }}."
        runbook_url: {{ $runbook }}#log-feed-silent
    # An outcome's last count is stamped, an event no scrape misses, as a counter's first increment or an unsampled reset is missed.
    - alert: TracekeepLogEntryUnreadable
      expr: min by (equipment_id) (time() - tracekeep_logfeed_last_outcome_timestamp_seconds{outcome="unreadable"}) < 3600
      labels:
        severity: warning
      annotations:
        summary: "Equipment {{ "{{" }} $labels.equipment_id {{ "}}" }}: the feed carried an entry tracekeep cannot read."
        runbook_url: {{ $runbook }}#log-entry-unreadable
    - alert: TracekeepLogEntriesLate
      expr: min by (equipment_id) (time() - tracekeep_logfeed_last_outcome_timestamp_seconds{outcome="stale"}) < 3600
      labels:
        severity: warning
      annotations:
        summary: "Equipment {{ "{{" }} $labels.equipment_id {{ "}}" }}: feed entries arrived too late to convert."
        runbook_url: {{ $runbook }}#log-entries-late
  {{- if .Values.alerts.gateway.enabled }}
  # The gateway's rules: the producer's metrics, which the gateways serve.
  - name: tracepub
    rules:
    - alert: TracepubEquipmentSilent
      # Connected through the last ten minutes (and seen ten minutes ago) with nothing published in them;
      # the SDK reports its counter at zero from its start, and the last clause keeps a gateway on an older SDK,
      # which has no counter until it publishes, counting a first publication as one.
      expr: |
        min_over_time(tracepub_bus_connected[10m]) == 1
        and on(job, instance) tracepub_bus_connected offset 10m
        unless on(job, instance) (
          increase(tracepub_records_published_total[10m]) > 0
          or (tracepub_records_published_total unless tracepub_records_published_total offset 10m)
        )
      for: 1m
      labels:
        severity: warning
      annotations:
        summary: "Producer {{ "{{" }} $labels.instance {{ "}}" }} is connected and has published nothing for ten minutes."
        runbook_url: {{ $runbook }}#equipment-silent
    - alert: TracepubDropping
      # The SDK reports every reason at zero when its publisher starts, so a reason's first drop counts;
      # a gateway on an older SDK reports a reason only from its first drop, which then counts from the second.
      expr: sum by (job, instance) (increase(tracepub_records_dropped_total[5m])) > 0
      labels:
        severity: warning
      annotations:
        summary: "Producer {{ "{{" }} $labels.instance {{ "}}" }} is dropping records."
        runbook_url: {{ $runbook }}#producer-drops
  {{- end }}
{{- end }}
